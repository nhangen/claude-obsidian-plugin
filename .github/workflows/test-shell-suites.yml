name: Shell test suites

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  bash-tests:
    name: Bash suites on Ubuntu
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OBSIDIAN_PUBLIC_CLIENT_SOURCE: ${{ github.workspace }}/.test-deps/obsidian-mcp
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Generate package projection before testing
        run: python3 scripts/sync-plugin-packages.py

      - name: Check out the public capture runtime fixture source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: nhangen/obsidian-mcp
          ref: f511884950777179de8e5bc47a2a5dd2bca52b7c
          path: .test-deps/obsidian-mcp
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.9.0
          cache: npm
          cache-dependency-path: packages/mcp-server/package-lock.json

      - name: Set expected origin for MCP tests
        run: git remote set-url origin https://github.com/nhangen/claude-obsidian-plugin

      - name: Install MCP server dependencies
        working-directory: packages/mcp-server
        run: npm ci

      - name: Install Codex CLI for the plugin smoke test
        run: npm install --global @openai/codex@0.166.0

      - name: Run all shell and MCP suites
        run: bash tests/run-all.sh

  sync-packages:
    name: Publish synchronized marketplace packages
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: bash-tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: obsidian-marketplace-sync-${{ github.sha }}
    steps:
      - name: Check out tested revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Publish generated package changes
        run: |
          git fetch origin master
          if test "$(git rev-parse HEAD)" != "$(git rev-parse origin/master)"; then
            echo "A newer master revision owns package publication."
            exit 0
          fi
          python3 scripts/sync-plugin-packages.py
          python3 scripts/sync-plugin-packages.py --check
          if git diff --quiet && test -z "$(git ls-files --others --exclude-standard)"; then
            exit 0
          fi
          git add -- .agents/plugins/obsidian-package-state.json .claude-plugin packages/codex packages/mcp-server/helpers
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Sync marketplace packages'
          if ! git push origin HEAD:refs/heads/master; then
            git fetch origin master
            test "$(git rev-parse HEAD^)" != "$(git rev-parse origin/master)"
            echo "A newer master revision owns package publication."
          fi
