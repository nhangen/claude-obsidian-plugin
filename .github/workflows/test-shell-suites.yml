name: Shell test suites

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  bash-tests:
    name: Bash suites on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.9.0
          cache: npm
          cache-dependency-path: packages/mcp-server/package-lock.json

      - name: Set expected origin for MCP tests
        run: git remote set-url origin https://github.com/nhangen/claude-obsidian-plugin

      - name: Install MCP server dependencies
        working-directory: packages/mcp-server
        run: npm ci

      - name: Install Codex CLI for the plugin smoke test
        run: npm install --global @openai/codex@0.162.1

      - name: Run all shell and MCP suites
        run: bash tests/run-all.sh
