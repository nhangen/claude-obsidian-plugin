name: MCP server release

on:
  push:
    tags:
      - "mcp-v*"
  workflow_dispatch:
    inputs:
      revision:
        description: Full commit SHA or mcp-v tag to build
        required: true
        type: string

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    outputs:
      source_commit: ${{ steps.source.outputs.commit }}
    steps:
      - name: Check out exact revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.revision || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.9.0
          cache: npm
          cache-dependency-path: packages/mcp-server/package-lock.json

      - name: Record source commit
        id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build, test, and pack release bundle
        working-directory: packages/mcp-server
        env:
          RELEASE_REVISION: ${{ github.event_name == 'workflow_dispatch' && inputs.revision || github.ref_name }}
        run: npm run release:bundle -- --revision "$RELEASE_REVISION"

      - name: Retain release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcp-server-${{ steps.source.outputs.commit }}
          path: packages/mcp-server/release/*
          if-no-files-found: error
          retention-days: 30

  publish:
    if: startsWith(github.ref, 'refs/tags/mcp-v')
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: mcp-server-${{ needs.bundle.outputs.source_commit }}
          path: release

      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            gh release create "$RELEASE_TAG" release/* \
              --verify-tag \
              --title "MCP server ${RELEASE_TAG#mcp-v}" \
              --generate-notes
          fi
